<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#151a2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 150) scale(420 300)">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="x" x1="250" y1="80" x2="342" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="word" x1="430" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="0.63" stop-color="#f4f6fb"/>
      <stop offset="0.68" stop-color="#c4b5fd"/>
      <stop offset="0.82" stop-color="#7aa2f7"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="420">
      <rect width="1200" height="420" fill="#fff"/>
      <circle cx="296" cy="126" r="56" fill="#000"/>
    </mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow)"/>

  <!-- mark: a page with an X spark -->
  <g mask="url(#cut)">
    <rect x="148" y="110" width="132" height="164" rx="22" fill="#a78bfa" fill-opacity="0.14" stroke="#7aa2f7" stroke-width="8"/>
    <g stroke="#7aa2f7" stroke-width="8" stroke-linecap="round">
      <line x1="180" y1="168" x2="248" y2="168"/>
      <line x1="180" y1="200" x2="248" y2="200"/>
      <line x1="180" y1="232" x2="222" y2="232"/>
    </g>
  </g>
  <g stroke="url(#x)" stroke-width="21" stroke-linecap="round">
    <line x1="262" y1="92" x2="330" y2="160"/>
    <line x1="330" y1="92" x2="262" y2="160"/>
  </g>

  <!-- wordmark -->
  <text x="430" y="196" font-size="112" font-weight="700" letter-spacing="-3" fill="url(#word)">GlossX</text>
  <text x="434" y="246" font-size="24" fill="#aab3c8">An open, plugin-native agent harness for research and learning</text>
  <text x="434" y="284" font-size="21" fill="#7f8aa3">旁注 · 面向科研与学习的开放 Agent Harness</text>

  <!-- capability chips -->
  <g font-size="17" fill="#c9d1e4">
    <g transform="translate(434 318)">
      <rect width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="59" y="24" text-anchor="middle">Read papers</text>
    </g>
    <g transform="translate(564 318)">
      <rect width="132" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="66" y="24" text-anchor="middle">Agent sessions</text>
    </g>
    <g transform="translate(708 318)">
      <rect width="142" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="71" y="24" text-anchor="middle">Verified claims</text>
    </g>
    <g transform="translate(862 318)">
      <rect width="158" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="79" y="24" text-anchor="middle">Git workspaces</text>
    </g>
    <g transform="translate(1032 318)">
      <rect width="96" height="36" rx="18" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="48" y="24" text-anchor="middle" fill="#ddd6fe">Plugins</text>
    </g>
  </g>
</svg>
